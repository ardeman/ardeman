name: Sync portfolio profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sync-profile.yml"]

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: profile
      - name: Checkout portfolio source
        uses: actions/checkout@v7.0.1
        with:
          repository: ardeman/project-profile-nextjs
          ref: main
          path: portfolio
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: portfolio/package.json
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: portfolio/.nvmrc
          cache: pnpm
          cache-dependency-path: portfolio/pnpm-lock.yaml
      - name: Install generator dependencies
        working-directory: portfolio
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test synchronization
        working-directory: portfolio
        run: pnpm test:github-profile
      - name: Update managed README sections
        working-directory: portfolio
        run: pnpm sync:github-profile ../profile/README.md
      - name: Commit changed profile
        working-directory: profile
        run: |
          if git diff --quiet -- README.md; then
            echo 'Profile already matches the portfolio.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs(profile): sync portfolio profile data'
          git push origin HEAD:main
          SOURCE_SHA=$(git -C ../portfolio rev-parse HEAD)
          printf 'Updated README from portfolio commit `%s`.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
